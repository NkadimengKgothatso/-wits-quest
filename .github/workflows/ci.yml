name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies (Frontend)
      run: npm install
      working-directory: ./frontend

    - name: Install dependencies (Backend)
      run: npm install
      working-directory: ./backend



    - name: Build Frontend
      run: npm run build
      working-directory: ./frontend

    - name: Build Backend
      run: npm run build
      working-directory: ./backend
