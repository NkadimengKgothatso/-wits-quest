site_name: Wits Quest Documentation
site_url: https://nkadimengkgothatso.github.io/-wits-quest/
site_description: >
  Centralised documentation for Wits Quest — a location-aware, turn-based campus
  adventure game developed by Team Big-O for the Wits University Software
  Development Project (COMS3011A).

repo_name: NkadimengKgothatso/-wits-quest
repo_url: https://github.com/NkadimengKgothatso/-wits-quest
edit_uri: edit/main/docs/

theme:
  name: material

  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - navigation.expand
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow

  icon:
    repo: fontawesome/brands/git-alt

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

# Nav sections are named after the Milestone 2 rubric categories, ordered by
# rubric weight, so the site can be walked category-by-category during the
# presentation. Supporting material follows.
nav:
  - Home: index.md

  - Core Features:
      - Game Overview & Tiers: project/overview.md
      - Requirements: project/requirements.md
      - Scope: project/scope.md
      - CPU Battle Rulebook: development/cpu-battle-rules.md
      - Live PvP Walkthrough: development/live-pvp-walkthrough.md
      - Async PvP Walkthrough: development/async-pvp-walkthrough.md

  - API:
      - API Reference: development/api-reference.md

  - Automated Testing:
      - Test Results & Coverage: development/testing.md

  - Stakeholder Reviews:
      - Meeting Records: meetings/index.md

  - User Feedback:
      - Feedback Form & Survey: project/user-feedback.md

  - Methodology:
      - Methodology: project/methodology.md
      - Git Workflow: development/git-workflow.md
      - Decisions Log: development/decisions-log.md
      - Technical Decisions: development/technical-decisions.md
      - Gitea Actions Migration: development/gitea-actions-migration-plan.md

  - Bug Tracker:
      - Bug Tracking: development/bug-tracking.md
      - Fix Register: development/fix-register.md

  - Database Docs:
      - Database Plan: database/database-plan.md
      - Database Schema: database/database-schema.md
      - ERD: uml/04_erd_database_schema.md

  - Third-Party Docs:
      - Third-Party Code & Services: development/third-party.md

  - Testing Docs:
      - Testing & CI/CD Plan: development/testing-plan.md

  - System Design (UML):
      - System Architecture: uml/01_system_architecture.md
      - Development Architecture: development/architecture.md
      - Class Diagram: uml/class-diagram.md
      - Use Case Diagram: uml/03_use_case_diagram.md
      - Use Case Description: uml/use-case.md
      - Battle State Machine: uml/02_battle_state_machine.md
      - Sequence Diagrams: uml/sequence-diagrams.md
      - Activity Diagrams: uml/activity-diagrams.md
      - UML Overview: uml/index.md

  - Sprints:
      - Overview: sprints/README.md
      - Master Guide V2: sprints/master-guide-v2.md
      - Sprint 1 Specification: sprints/SPRINT1.md
      - Sprint 1 Implementation Guide: sprints/WITS_QUEST_SPRINT1_GUIDE.md
      - Sprint 2 Feature Selection: sprints/SPRINT2_FEATURE_SELECTION_AND_TASK_GUIDE.md
      - Sprint 2 Handover Guide: sprints/WITS_QUEST_SPRINT2_HANDOVER_GUIDE.md
