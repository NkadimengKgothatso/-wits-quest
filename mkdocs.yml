site_name: Wits-Quest Documentation

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md

  - Project:
      - Overview: project/overview.md
      - Requirements: project/requirements.md
      - Scope: project/scope.md

  - UML Diagrams:
      - Overview: uml/index.md
      - Use Case Diagram: uml/use-case.md
      - Class Diagram: uml/class-diagram.md
      - Sequence Diagrams: uml/sequence-diagrams.md
      - Activity Diagrams: uml/activity-diagrams.md

  - Database:
      - Database Plan: database/database-plan.md
      - Database Schema: database/database-schema.md

  - Meetings:
      - Meeting Records: meetings/index.md

  - Development:
      - Architecture: development/architecture.md
      - Git Workflow: development/git-workflow.md
      - Technical Decisions: development/technical-decisions.md
